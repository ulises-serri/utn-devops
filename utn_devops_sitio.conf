<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    # Definimos la nueva ruta
    DocumentRoot /var/www/utn_devops_sitio

    <Directory /var/www/utn_devops_sitio>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>